<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`; must start and end with "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Concise Kubernetes study notes, flashcards, quizzes and CKA-domain practice tests. Works offline.">
  <meta name="theme-color" content="#2F6FDE">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="K8 Study">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>K8 Study</title>

  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    @media (prefers-color-scheme: dark) { html, body { background: #111318; } }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; font: 600 18px system-ui, sans-serif; color: #2F6FDE;
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">K8 Study</div>
  <noscript>K8 Study needs JavaScript to run.</noscript>

  <script>
    // Custom offline service worker (spec §8). Precache list is filled in by
    // `dart run tool/gen_precache.dart` after `flutter build web`.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function (e) {
          console.warn('Service worker registration failed', e);
        });
      });
    }
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
